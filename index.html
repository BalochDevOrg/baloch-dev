<!doctype html>
<html lang="en" class="light" data-theme="original">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baloch Export Hub — Taking Balochi Creativity to the World</title>
    <meta
      name="description"
      content="Baloch Export Hub is a digital marketplace connecting Balochi creators, artisans, craftsmen, artists, writers and designers with buyers around the world. Create your free store today."
    />
    <meta name="theme-color" content="#FAF7F2" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23144237'/%3E%3Ccircle cx='40' cy='24' r='12' fill='%23D97706'/%3E%3Cpolygon points='24,20 48,50 4,50' fill='%23FAF7F2'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* First-paint splash to avoid a white flash before the app mounts */
      html { background: #FAF7F2; }
      html.dark { background: #161D22; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex;
        align-items: center; justify-content: center; flex-direction: column; gap: 14px;
        background: #FAF7F2;
        color: #144237; font-family: 'Roboto Slab', serif;
        transition: opacity .5s ease; pointer-events: none;
      }
      html.dark #splash {
        background: #161D22;
        color: #F0F4F6;
      }
      #splash .mark { animation: splash-spin 7s linear infinite; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      try {
        var t = localStorage.getItem('beh-theme')
        if (t === 'light') t = 'original'
        if (t !== 'dark' && t !== 'alternative') t = 'original'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.classList.toggle('dark', t !== 'original')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <svg class="mark" width="56" height="56" viewBox="0 0 64 64" fill="none">
        <rect x="18" y="18" width="28" height="28" stroke="#D9A441" stroke-width="3" />
        <rect x="18" y="18" width="28" height="28" stroke="#2DD4BF" stroke-width="3" transform="rotate(45 32 32)" />
        <circle cx="32" cy="32" r="5" fill="#D9A441" />
      </svg>
      <p style="margin:0; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; opacity: .7">
        Baloch Export Hub
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
